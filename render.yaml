# ════════════════════════════════════════════════════════════════════
# Render Blueprint — RKS ONE API  (https://api.rksone.qenbel.site)
# https://render.com/docs/blueprint-spec
#
# The web app is NOT here: Vercel builds and serves frontend/ (see frontend/vercel.json).
#
# HOW TO USE:
#   1. Render Dashboard → New → Blueprint → connect rkscomputercenter/rksone
#   2. Fill in the `sync: false` secrets when Render asks for them
#   3. Settings → Custom Domains → add api.rksone.qenbel.site
#      (DNS: CNAME api.rksone → <service>.onrender.com)
# ════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: rksone-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render free tier — Singapore is closest to India (and to the Supabase project)
    plan: free
    region: singapore

    healthCheckPath: /api/health

    # Deploy on every push to main; frontend-only changes don't rebuild the API
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - Dockerfile
        - .dockerignore
        - render.yaml

    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; 10000 is its default
      - key: PORT
        value: 10000
      - key: TZ
        value: Asia/Kolkata
      - key: LOG_RETENTION_DAYS
        value: 60
      # Render's proxy sits in front of the app (2 if the DNS record is proxied by Cloudflare)
      - key: TRUST_PROXY_HOPS
        value: 1
      # Browser origins allowed to call the API (the Vercel web app)
      - key: ALLOWED_ORIGINS
        value: https://rksone.qenbel.site,https://app.rksone.qenbel.site

      # ── Secrets — entered in the Render Dashboard, never committed ──
      # DATABASE_URL: Supabase session pooler, port 5432 (no pgbouncer=true). URL-encode
      # special characters in the password (@ → %40):
      #   postgresql://postgres.<ref>:<password>@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require&connection_limit=5
      - key: DATABASE_URL
        sync: false
      # JWT_SECRET: openssl rand -base64 48 (new; never reuse the old service's secret)
      - key: JWT_SECRET
        sync: false
      # APK_URL: absolute link to the current Android APK (e.g. a GitHub Release asset)
      - key: APK_URL
        sync: false
